<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de texte - Modèle 50.1M</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f9fafb;
            color: #111827;
        }
        .container {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 2rem;
            border: 1px solid #e5e7eb;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            color: #4b5563;
            margin-bottom: 2rem;
            border-left: 3px solid #3b82f6;
            padding-left: 1rem;
        }
        label {
            font-weight: 500;
            display: block;
            margin-bottom: 0.5rem;
            color: #1f2937;
        }
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 1rem;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .slider-container {
            margin: 1.5rem 0 1rem;
        }
        .slider-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .slider-item {
            flex: 1;
            min-width: 180px;
        }
        input[type="range"] {
            width: 100%;
            margin: 0.5rem 0;
        }
        .param-value {
            font-size: 0.85rem;
            background: #f3f4f6;
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #1f2937;
        }
        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 1rem 0 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button:hover {
            background: #1e40af;
            transform: scale(1.02);
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            min-height: 120px;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.75rem;
            border-radius: 1rem;
            margin-top: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ Générateur de texte</h1>
    <div class="sub">Modèle 50.1M — API Hugging Face Space (raf8101/50.1M)</div>

    <label for="prompt">📝 Votre prompt</label>
    <textarea id="prompt" rows="3" placeholder="Exemple : Raconte-moi une petite histoire sur un astronaute curieux..."></textarea>

    <div class="slider-container">
        <div class="slider-row">
            <div class="slider-item">
                <label>🔢 Max new tokens <span id="maxTokensValue" class="param-value">110</span></label>
                <input type="range" id="maxTokens" min="10" max="300" step="5" value="110">
            </div>
            <div class="slider-item">
                <label>🎨 Température (créativité) <span id="tempValue" class="param-value">0.85</span></label>
                <input type="range" id="temperature" min="0.1" max="1.5" step="0.01" value="0.85">
            </div>
        </div>
    </div>

    <button id="generateBtn">🚀 Générer le texte</button>

    <label>✨ Texte généré</label>
    <div id="result" class="result-box">Le résultat apparaîtra ici...</div>
    <div id="errorMsg" class="error" style="display: none;"></div>
</div>
<footer>Appel direct à l'API Gradio — Modèle hébergé sur Hugging Face 🤗</footer>

<script type="module">
    // Import du client Gradio depuis le CDN
    import { Client } from 'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';

    // Éléments DOM
    const promptInput = document.getElementById('prompt');
    const maxTokensSlider = document.getElementById('maxTokens');
    const tempSlider = document.getElementById('temperature');
    const maxTokensValue = document.getElementById('maxTokensValue');
    const tempValue = document.getElementById('tempValue');
    const generateBtn = document.getElementById('generateBtn');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('errorMsg');

    // Mise à jour des affichages des sliders
    maxTokensSlider.addEventListener('input', () => {
        maxTokensValue.textContent = maxTokensSlider.value;
    });
    tempSlider.addEventListener('input', () => {
        tempValue.textContent = parseFloat(tempSlider.value).toFixed(2);
    });

    // Variable pour stocker le client connecté (initialisé une fois)
    let gradioClient = null;

    // Fonction d'initialisation du client
    async function initClient() {
        if (gradioClient) return gradioClient;
        try {
            // Connexion au Space public (pas besoin de token)
            gradioClient = await Client.connect("raf8101/50.1M");
            console.log("✅ Client connecté au Space raf8101/50.1M");
            return gradioClient;
        } catch (err) {
            console.error("Erreur de connexion au Space :", err);
            throw new Error("Impossible de se connecter à l'API. Vérifie ta connexion internet ou si le Space est accessible.");
        }
    }

    // Fonction principale d'appel à l'API
    async function generateText() {
        // Réinitialiser les messages d'erreur et affichage
        errorDiv.style.display = 'none';
        errorDiv.innerText = '';
        resultDiv.innerHTML = '<span class="loader"></span> Génération en cours... (peut prendre 15-25 secondes)';

        // Récupérer les valeurs
        const prompt = promptInput.value.trim();
        if (!prompt) {
            resultDiv.innerHTML = '⚠️ Veuillez entrer un prompt.';
            return;
        }

        const maxTokens = parseFloat(maxTokensSlider.value);
        const temperature = parseFloat(tempSlider.value);

        // Désactiver le bouton pendant l'appel
        generateBtn.disabled = true;

        try {
            // 1. Connexion / récupération du client
            const client = await initClient();

            // 2. Appel à l'API avec le bon nom : /generate_text
            //    Les paramètres : prompt (string), max_new_tokens (float), temperature (float)
            const prediction = await client.predict("/generate_text", {
                prompt: prompt,
                max_new_tokens: maxTokens,
                temperature: temperature
            });

            // 3. Le résultat est dans prediction.data (tableau)
            //    D'après la doc, l'API retourne une seule chaîne (str)
            const generatedText = prediction.data;
            if (generatedText && typeof generatedText === 'string') {
                resultDiv.innerHTML = generatedText;
            } else if (Array.isArray(generatedText) && generatedText.length > 0) {
                // Au cas où le retour serait un tableau à un élément
                resultDiv.innerHTML = generatedText[0];
            } else {
                resultDiv.innerHTML = "✅ Texte généré (format inattendu) : " + JSON.stringify(generatedText);
            }
        } catch (err) {
            console.error("Erreur lors de l'appel :", err);
            errorDiv.style.display = 'block';
            errorDiv.innerText = `❌ Erreur : ${err.message || "Vérifie la console pour plus de détails"}. Si l'erreur persiste, le Space pourrait être surchargé ou l'API a changé.`;
            resultDiv.innerHTML = "Une erreur est survenue. Réessaie plus tard.";
        } finally {
            generateBtn.disabled = false;
        }
    }

    // Événement du bouton
    generateBtn.addEventListener('click', generateText);

    // Optionnel : pré-initialiser le client au chargement de la page (gain de temps)
    initClient().catch(err => {
        console.warn("Pré-initialisation échouée mais l'appel fonctionnera quand même :", err);
        // Pas d'alerte bloquante, l'appel retentera la connexion
    });

    // Petit exemple de prompt par défaut (pour tester)
    if (!promptInput.value) {
        promptInput.value = "Raconte-moi une blague courte sur un ordinateur qui apprend à parler.";
    }
</script>
</body>
</html>
