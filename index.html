<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Transformer 50M – générateur de texte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* Conteneur principal – style "papier" très épuré */
        .chat-container {
            max-width: 800px;
            width: 100%;
            height: 90vh;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* Zone des messages : défilement libre */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        /* Style des messages utilisateur (bulles) */
        .user-message {
            align-self: flex-end;
            max-width: 80%;
            background: #1e2a3e;
            color: white;
            padding: 0.7rem 1.2rem;
            border-radius: 24px 24px 4px 24px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }

        /* Messages du bot : pas de bulle, juste du texte simple à gauche */
        .bot-message {
            align-self: flex-start;
            max-width: 85%;
            color: #1e2a3e;
            background: transparent;
            padding: 0.2rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            border-left: 3px solid #e2e8f0;
            padding-left: 0.9rem;
            margin-left: 0.2rem;
        }

        /* État "en train d'écrire" (indicateur léger) */
        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            color: #6c7a9e;
            font-size: 0.85rem;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #9aa6c1;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }

        /* Barre de contrôle en bas */
        .controls {
            background: #f8fafc;
            border-top: 1px solid #e9edf2;
            padding: 1rem 1.5rem 0.8rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: center;
            justify-content: space-between;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            background: #ffffff;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .slider-group label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #334155;
            letter-spacing: -0.2px;
        }
        .slider-group span {
            font-size: 0.8rem;
            font-weight: 500;
            background: #f1f5f9;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            color: #0f172a;
            min-width: 45px;
            text-align: center;
        }
        input[type="range"] {
            width: 130px;
            height: 4px;
            -webkit-appearance: none;
            background: #cbd5e1;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1e2a3e;
            cursor: pointer;
            border: none;
        }

        /* Zone de saisie + bouton */
        .input-area {
            background: #f8fafc;
            border-top: 1px solid #e9edf2;
            padding: 0.8rem 1.5rem 1.3rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            padding: 0.75rem 1.2rem;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border 0.2s;
            color: #0f172a;
        }
        textarea:focus {
            border-color: #1e2a3e;
        }
        button {
            background: #1e2a3e;
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1.3rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            background: #0f172a;
            transform: scale(0.97);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .status {
            text-align: center;
            font-size: 0.7rem;
            color: #6c7a9e;
            padding: 0.4rem 1rem 0.8rem 1rem;
            background: #f8fafc;
            border-top: 1px solid #eef2f6;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- zone d'affichage des messages -->
    <div class="messages-area" id="messageList">
        <div class="bot-message">
            ⚡ Modèle Transformer 50M prêt. Écrivez le début d’un texte, ajustez la longueur et la température.
        </div>
    </div>

    <!-- réglages (curseurs) -->
    <div class="controls">
        <div class="slider-group">
            <label>📏 Tokens max</label>
            <input type="range" id="maxTokensSlider" min="20" max="250" value="120" step="5">
            <span id="tokenValue">120</span>
        </div>
        <div class="slider-group">
            <label>🎨 Température</label>
            <input type="range" id="temperatureSlider" min="0.2" max="1.4" value="0.85" step="0.02">
            <span id="tempValue">0.85</span>
        </div>
    </div>

    <!-- saisie utilisateur -->
    <div class="input-area">
        <textarea id="promptInput" rows="1" placeholder="Écrivez le début du texte... (Entrée pour envoyer, Shift+Entrée = retour ligne)"></textarea>
        <button id="sendButton">✧ Envoyer</button>
    </div>
    <div class="status" id="statusMessage">✅ API Hugging Face connectée</div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. Configuration de l'API Gradio (mettre à jour si besoin)
    // --------------------------------------------------------------
    const API_URL = "https://raf8101-50.1m.hf.space/api/predict";

    // Éléments DOM
    const messageContainer = document.getElementById('messageList');
    const promptTextarea = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendButton');
    const statusSpan = document.getElementById('statusMessage');

    const maxTokensSlider = document.getElementById('maxTokensSlider');
    const tokenValueSpan = document.getElementById('tokenValue');
    const temperatureSlider = document.getElementById('temperatureSlider');
    const tempValueSpan = document.getElementById('tempValue');

    // Mise à jour affichage curseurs
    maxTokensSlider.addEventListener('input', () => {
        tokenValueSpan.innerText = maxTokensSlider.value;
    });
    temperatureSlider.addEventListener('input', () => {
        tempValueSpan.innerText = parseFloat(temperatureSlider.value).toFixed(2);
    });

    // Ajustement hauteur automatique du textarea
    promptTextarea.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(100, this.scrollHeight) + 'px';
    });

    // Ajouter un message utilisateur (bulle)
    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'user-message';
        div.textContent = text;
        messageContainer.appendChild(div);
        scrollToBottom();
        return div;
    }

    // Ajouter un message du bot (sans bulle, simple texte)
    function addBotMessage(text, isTypingPlaceholder = false) {
        const div = document.createElement('div');
        div.className = 'bot-message';
        if (isTypingPlaceholder) {
            div.innerHTML = `<div class="typing-indicator">Modèle réfléchit<span></span><span></span><span></span></div>`;
        } else {
            div.textContent = text;
        }
        messageContainer.appendChild(div);
        scrollToBottom();
        return div;
    }

    function scrollToBottom() {
        messageContainer.scrollTo({ top: messageContainer.scrollHeight, behavior: 'smooth' });
    }

    // État de chargement
    function setLoading(loading) {
        sendBtn.disabled = loading;
        if (loading) {
            sendBtn.innerHTML = '⏳ Génération';
            statusSpan.innerText = '🧠 Le modèle écrit... (CPU, quelques secondes)';
        } else {
            sendBtn.innerHTML = '✧ Envoyer';
            statusSpan.innerText = '✅ Prêt · API active';
        }
    }

    // Appel à l'API Gradio
    async function generateText(prompt, maxTokens, temperature) {
        setLoading(true);
        addUserMessage(prompt);                // bulle utilisateur
        promptTextarea.value = '';
        promptTextarea.style.height = 'auto';

        // Message temporaire du bot (indicateur de réflexion)
        const tempBotDiv = addBotMessage('', true);   // affiche "Modèle réfléchit..."

        try {
            const payload = { data: [prompt, maxTokens, temperature] };
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - ${response.statusText}`);
            }
            const result = await response.json();
            const generatedText = result?.data?.[0];
            if (!generatedText) throw new Error('Réponse API invalide (pas de data)');

            // remplacer le message temporaire par le vrai texte (sans bulle)
            tempBotDiv.innerHTML = '';   // efface l'indicateur
            tempBotDiv.textContent = generatedText;
        } catch (error) {
            console.error('Erreur API :', error);
            tempBotDiv.innerHTML = '';   // supprime l'indicateur
            tempBotDiv.textContent = `❌ Erreur : ${error.message}. Vérifiez que le Space est en "Running".`;
            statusSpan.innerText = '⚠️ Échec connexion API';
        } finally {
            setLoading(false);
            scrollToBottom();
        }
    }

    // Événement d'envoi
    sendBtn.addEventListener('click', () => {
        const rawPrompt = promptTextarea.value.trim();
        if (rawPrompt === '') {
            statusSpan.innerText = '✏️ Écrivez quelque chose avant d’envoyer.';
            return;
        }
        const maxTokens = parseInt(maxTokensSlider.value, 10);
        const temperature = parseFloat(temperatureSlider.value);
        generateText(rawPrompt, maxTokens, temperature);
    });

    // Envoyer avec Entrée (Shift+Entrée pour retour à la ligne)
    promptTextarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (promptTextarea.value.trim()) sendBtn.click();
        }
    });

    // Petit test de connexion à l'API au chargement (optionnel, silencieux)
    async function testApiAvailability() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            await fetch(API_URL, { method: 'OPTIONS', signal: controller.signal });
            clearTimeout(timeoutId);
            statusSpan.innerText = '✅ API opérationnelle · prêt à générer';
        } catch (err) {
            console.warn('Test API :', err);
            statusSpan.innerText = '⚠️ API injoignable ? Vérifiez que le Space est "Running"';
        }
    }
    testApiAvailability();
</script>
</body>
</html>
