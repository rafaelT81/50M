<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modèle Transformer 50M - Chat IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f121f 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .chat-container {
            max-width: 900px;
            width: 100%;
            background: rgba(22, 26, 40, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .header {
            padding: 1.2rem 1.8rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #c0e0ff, #8f9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            font-size: 0.8rem;
            color: #8e9aaf;
            margin-top: 0.25rem;
        }

        .messages {
            height: 500px;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 0.8rem;
            animation: fadeIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a2f45;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background: #4f46e5;
            order: 1;
        }

        .bot .avatar {
            background: #1e293b;
        }

        .bubble {
            max-width: 75%;
            padding: 0.75rem 1.2rem;
            border-radius: 1.8rem;
            line-height: 1.45;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .user .bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .bot .bubble {
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 0.3rem;
            border: 1px solid #334155;
        }

        .input-area {
            padding: 1rem 1.5rem 1.5rem;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            background: #0f111e;
            border-radius: 3rem;
            padding: 0.25rem 0.25rem 0.25rem 1.2rem;
            border: 1px solid #2d3348;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 0;
            font-size: 0.95rem;
            color: #f1f5f9;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #525b7a;
        }

        button {
            background: #4f46e5;
            border: none;
            border-radius: 2rem;
            padding: 0 1.2rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #6366f1;
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .status {
            text-align: center;
            font-size: 0.7rem;
            color: #6c7a9a;
            margin-top: 0.8rem;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        <h1>⚡ Transformer 50M</h1>
        <p>Modèle decoder-only · API sur Hugging Face</p>
    </div>
    <div class="messages" id="messages">
        <div class="message bot">
            <div class="avatar">🤖</div>
            <div class="bubble">Bonjour ! Envoyez-moi un texte et je continuerai la génération.</div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-group">
            <textarea id="prompt" rows="1" placeholder="Écrivez le début de votre texte..."></textarea>
            <button id="sendBtn">➤ Envoyer</button>
        </div>
        <div class="status" id="status">✅ Prêt</div>
    </div>
</div>

<script>
    // ⚠️ Remplace par l'URL de ton Space (sans /logs ni ?...)
    const API_URL = "https://raf8101-50M.hf.space/api/predict";

    const messagesDiv = document.getElementById('messages');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    // Auto-resize du textarea
    promptInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(120, this.scrollHeight) + 'px';
    });

    function addMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = isUser ? '👤' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return bubble;
    }

    function setLoading(loading) {
        sendBtn.disabled = loading;
        if (loading) {
            sendBtn.innerHTML = '<div class="loading"></div>';
            statusDiv.textContent = '⏳ Le modèle génère... (CPU)';
        } else {
            sendBtn.innerHTML = '➤ Envoyer';
            statusDiv.textContent = '✅ Prêt';
        }
    }

    async function generate(prompt) {
        setLoading(true);
        addMessage(prompt, true);
        promptInput.value = '';
        promptInput.style.height = 'auto';

        const tempBubble = addMessage('🤔 Génération en cours...', false);

        try {
            // L'API Gradio attend un objet {data: [prompt, max_tokens, temperature]}
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    data: [prompt, 150, 0.8]   // [prompt, max_new_tokens, temperature]
                })
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            const generated = result.data[0];  // Le texte généré est dans data[0]
            tempBubble.textContent = generated;
        } catch (error) {
            console.error(error);
            tempBubble.textContent = `❌ Erreur : ${error.message}. Vérifiez que l'API Gradio est bien démarrée.`;
            statusDiv.textContent = '⚠️ Échec de connexion à l’API';
        } finally {
            setLoading(false);
        }
    }

    sendBtn.addEventListener('click', () => {
        const text = promptInput.value.trim();
        if (text) generate(text);
    });

    promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (promptInput.value.trim()) sendBtn.click();
        }
    });
</script>
</body>
</html>
